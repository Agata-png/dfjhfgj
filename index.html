<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Türkçe Ders Takip</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb;--ok:#16a34a;--now:#f59e0b;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topin{max-width:1180px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;font-size:20px}.sub{color:var(--muted);font-size:12px}.wrap{max-width:1180px;margin:0 auto;padding:24px 20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:#fff;background:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.card h3{margin:0 0 7px}.muted{color:var(--muted)}.status{font-weight:700;margin:10px 0}.bar{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--primary)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tab{padding:9px 14px;border-radius:9px;background:#e9eef7;white-space:nowrap}.tab.active{background:var(--primary);color:#fff}.unit{margin:18px 0}.unit h3{margin:0 0 10px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:760px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:center}.table th{font-size:12px;color:var(--muted);background:#fafafa}.table th:first-child,.table td:first-child{text-align:left;font-weight:700}.cell{width:38px;height:38px;border-radius:8px;background:#f1f5f9;color:#64748b}.cell.done{background:#dcfce7;color:#166534}.cell.now{background:#fef3c7;color:#92400e;outline:2px solid #f59e0b}.cell:hover{transform:translateY(-1px)}.notice{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;margin-bottom:18px}.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px}.modal h2{margin-top:0}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input{border:1px solid var(--line);border-radius:9px;padding:11px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.hidden{display:none!important}.history{max-height:360px;overflow:auto}.history div{padding:10px 0;border-bottom:1px solid var(--line)}.adminbox{border:1px solid #fecaca;background:#fff7f7;padding:16px;border-radius:12px}.footer{color:var(--muted);font-size:12px;margin-top:28px}
@media(max-width:600px){.topin{padding:13px 14px}.wrap{padding:18px 14px}.brand{font-size:17px}.grid{grid-template-columns:1fr}.top .sub{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div><div class="brand">📚 Türkçe Ders Takip</div><div class="sub">Ortak sınıf ilerleme sistemi</div></div><div><button class="btn small" id="homeBtn">Ana Sayfa</button> <button class="btn small" id="adminBtn">Yönetici</button></div></div></header>
<main class="wrap" id="app"></main>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CFG={SUPABASE_URL:'BURAYA_SUPABASE_URL',SUPABASE_ANON_KEY:'BURAYA_SUPABASE_ANON_KEY'};
const LEVELS=['A1','A2','B1','B2','C1']; const CLASSES=LEVELS.flatMap(l=>[l+'-1',l+'-2']);
const STAGES=[['H','Hazırlık'],['O','Okuma'],['Y','Yazma'],['K','Konuşma'],['D','Dinleme'],['E','Etkinlik']];
let sb=null, state={teacher:localStorage.getItem('teacherName')||'', cls:localStorage.getItem('className')||null, current:'home'};
const configured=!CFG.SUPABASE_URL.includes('BURAYA_')&&!CFG.SUPABASE_ANON_KEY.includes('BURAYA_'); if(configured) sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function stageName(x){return STAGES.find(s=>s[0]===x)?.[1]||x}
function code(u,b,s){return `${u}${b}-${s}`}
function setupNotice(){return configured?'':`<div class="notice"><b>Kurulum gerekiyor.</b> Bu paket hazır. Önce Supabase projesi oluşturup SQL dosyasını çalıştırın; ardından index.html içindeki iki Supabase bilgisini girin.</div>`}
async function getProgress(){if(!sb)return[]; const {data,error}=await sb.from('progress').select('*').order('created_at',{ascending:false}); if(error){alert(error.message);return[]} return data||[]}
async function home(){state.current='home'; const rows=await getProgress(); const last={}; for(const r of rows){if(!last[r.class_name])last[r.class_name]=r} app.innerHTML=`<h1>Genel Durum</h1>${setupNotice()}<div class="toolbar">${LEVELS.map(l=>`<button class="tab" onclick="filterLevel('${l}')">${l}</button>`).join('')}<button class="tab active" onclick="filterLevel('ALL')">Tümü</button></div><div class="grid" id="classGrid"></div><div class="footer">10 şube · 6 ünite · 3 bölüm · 6 aşama · toplam 1.080 takip noktası</div>`; renderClassGrid('ALL',last)}
function renderClassGrid(level,last){const list=level==='ALL'?CLASSES:CLASSES.filter(x=>x.startsWith(level+'-')); classGrid.innerHTML=list.map(c=>{const r=last[c]; return `<div class="card" onclick="openClass('${c}')"><h3>${c}</h3><div class="muted">${r?`Son durum: <b>${code(r.unit,r.section,r.stage)}</b> · ${stageName(r.stage)}`:'Henüz başlangıç yapılmadı'}</div><div class="status">${r?`Güncelleyen: ${esc(r.teacher_name)}<br><span class="muted">${new Date(r.created_at).toLocaleString('tr-TR')}</span>`:' '}</div><div class="bar"><div class="fill" style="width:${r?Math.min(100,(r.unit*18+(r.section==='A'?0:r.section==='B'?6:12)+(STAGES.findIndex(x=>x[0]===r.stage)+1))/108*100):0}%"></div></div></div>`}).join('')}
function filterLevel(level){getProgress().then(rows=>{const last={};for(const r of rows){if(!last[r.class_name])last[r.class_name]=r}renderClassGrid(level,last)})}
async function openClass(cls){state.cls=cls;localStorage.setItem('className',cls); const rows=await getProgress(); const mine=rows.filter(r=>r.class_name===cls); const done=new Set(mine.map(r=>`${r.unit}-${r.section}-${r.stage}`)); const latest=mine[0]; app.innerHTML=`<div class="row"><div><h1>${cls}</h1><div class="muted">Yeni İstanbul ${cls.split('-')[0]}</div></div><button class="btn" onclick="home()">← Geri</button></div>${latest?`<div class="notice"><b>Son durum: ${code(latest.unit,latest.section,latest.stage)}</b> — ${stageName(latest.stage)} · ${esc(latest.teacher_name)}</div>`:`<div class="notice">Bu şubede henüz işaretleme yapılmadı.</div>`}<div id="units"></div><h2>Geçmiş</h2><div class="card history">${mine.slice(0,30).map(r=>`<div><b>${code(r.unit,r.section,r.stage)}</b> — ${stageName(r.stage)}<br><span class="muted">${esc(r.teacher_name)} · ${new Date(r.created_at).toLocaleString('tr-TR')}</span></div>`).join('')||'<span class="muted">Kayıt yok.</span>'}</div>`; renderUnits(done)}
function renderUnits(done){units.innerHTML=Array.from({length:6},(_,i)=>{const u=i+1;return `<section class="unit"><h3>Ünite ${u}</h3><div class="tablewrap"><table class="table"><thead><tr><th>Bölüm</th>${STAGES.map(s=>`<th>${s[0]}<br>${s[1]}</th>`).join('')}</tr></thead><tbody>${['A','B','C'].map(sec=>`<tr><td>${u}${sec}</td>${STAGES.map(([st])=>{const k=`${u}-${sec}-${st}`;return `<td><button class="cell ${done.has(k)?'done':''}" onclick="mark(${u},'${sec}','${st}',${done.has(k)})">${done.has(k)?'✓':'○'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`}).join('')}
async function mark(unit,section,stage,isDone){if(isDone){if(!confirm('Bu kayıt zaten tamamlandı. Kaldırmak için yönetici düzenlemesini kullanın.'))return;return} if(!state.teacher){showTeacherModal(()=>mark(unit,section,stage,false));return} if(!sb){alert('Supabase kurulumu tamamlanmamış.');return} const {error}=await sb.from('progress').insert({class_name:state.cls,unit,section,stage,teacher_name:state.teacher}); if(error)alert(error.message); else openClass(state.cls)}
function showTeacherModal(cb){modalRoot.innerHTML=`<div class="modalbg"><div class="modal"><h2>Öğretmen adı</h2><p class="muted">İşlemi kimin yaptığını geçmişte göstermek için adınızı yazın.</p><div class="field"><input id="teacherInput" placeholder="Ad Soyad" value="${esc(state.teacher)}"></div><div class="row"><button class="btn" onclick="modalRoot.innerHTML=''">İptal</button><button class="btn primary" onclick="saveTeacher()">Devam</button></div></div></div>`;window._afterTeacher=cb}
function saveTeacher(){const v=document.getElementById('teacherInput').value.trim();if(!v)return;state.teacher=v;localStorage.setItem('teacherName',v);modalRoot.innerHTML='';if(window._afterTeacher)window._afterTeacher()}
function admin(){state.current='admin';app.innerHTML=`<h1>Yönetici Paneli</h1>${setupNotice()}<div class="adminbox"><h3>Yönetici girişi</h3><div class="field"><input id="adminPass" type="password" placeholder="Yönetici parolası"></div><button class="btn primary" onclick="adminLogin()">Giriş</button></div><div id="adminPanel"></div>`}
async function adminLogin(){if(!sb){alert('Önce Supabase kurulumu yapılmalı.');return}const p=adminPass.value;const {data,error}=await sb.rpc('admin_login',{p_password:p});if(error||!data){alert('Parola hatalı.');return}renderAdmin()}
async function renderAdmin(){const rows=await getProgress();const counts={};for(const r of rows)counts[r.class_name]=(counts[r.class_name]||0)+1;adminPanel.innerHTML=`<div class="card" style="margin-top:18px"><h2>Şube Yönetimi</h2><p class="muted">İlerlemeler kayıt olarak tutulur. Sıfırlama işlemi mevcut dönemi arşivler.</p><div class="grid">${CLASSES.map(c=>`<div class="card"><b>${c}</b><div class="muted">${counts[c]||0} işlem kaydı</div><button class="btn small" style="margin-top:10px" onclick="adminClass('${c}')">Düzenle</button></div>`).join('')}</div></div>`}
async function adminClass(cls){const ok=prompt(`${cls} için yönetici işlemi. 'SIFIRLA' yazarsanız mevcut kayıtlar arşivlenip yeni dönem başlar.`);if(ok!=='SIFIRLA')return;const p=prompt('Yönetici parolası:');const {data,error}=await sb.rpc('admin_reset_class',{p_class_name:cls,p_password:p});if(error||!data){alert(error?.message||'İşlem başarısız.');return}alert(`${cls} yeni dönem için sıfırlandı.`);renderAdmin()}
homeBtn.onclick=home;adminBtn.onclick=admin;home();
</script>
</body></html>
